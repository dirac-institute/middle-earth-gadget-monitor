apiVersion: 1

providers:
  - name: gadget-monitor
    folder: gadget-monitor
    type: file
    disableDeletion: true
    # Repo dashboards are read-only in the UI; use "Save as" to keep a
    # personal copy (stored in grafana.db, which is backed up).
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
  # Per-user dashboards. The entrypoint removes every role's access to this
  # folder (by uid), leaving it to admins; anonymous viewers never see it.
  - name: gadget-monitor-admin
    folder: Admin
    folderUid: gadget-admin
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards-admin
