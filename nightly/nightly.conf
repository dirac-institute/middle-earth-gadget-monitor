# This project's settings for the nightly agent, sourced by run.sh (bash).
# Everything else in nightly/ is the same for every project: to use the agent
# in another repo, copy nightly/ there and edit this file (README.md, "Using
# it in another project").
# shellcheck shell=bash disable=SC2034  # the variables are used by run.sh

# The live checkout. run.sh, the prompt, the settings and this file are read
# from it, and the agent never edits it. The live stack, if any, is deployed
# from it.
LIVE=/root/middle-earth-gadget-monitor
REPO_URL=https://github.com/dirac-institute/middle-earth-gadget-monitor.git
# The agent's clone, logs, plan usage snapshots and lock.
WORK=/root/gadget-nightly
# Sessions are named <SESSION_PREFIX>-<date>-<n>. Projects that share a Claude
# login (the same user on the same machine) need different prefixes.
SESSION_PREFIX=nightly

# The live stack. Containers with this podman label are snapshotted before the
# night; if a session changed them, RESTORE_CMD runs in $LIVE to put them
# back. Leave LIVE_LABEL empty for a project with no live stack.
LIVE_LABEL=idac.service=gadget-monitor
RESTORE_CMD="podman compose up -d --build --force-recreate"
# Untracked files copied from $LIVE into each fresh clone.
COPY_FILES=(.env)

# The limits in run.sh (TIME_LIMIT_S, IDLE_STOP, MAX_SESSIONS, ...) can be
# overridden here too.
