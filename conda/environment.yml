# The conda environment the conda probe activates (README.md, "Conda probe").
# conda/setup.sh creates it in every location in config/conda.toml, and
# updates them when this file changes. Every package the probe imports
# (`packages` in config/conda.toml) must be listed here.
#
# conda-forge only: Anaconda's own channels need a terms-of-service
# acceptance and, for some organizations, a license.
name: gadget-probe
channels:
  - conda-forge
dependencies:
  - python=3.12
  - lsdb
