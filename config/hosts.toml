# Hosts monitored by the collector.
#
# Each host gets one persistent SSH session running the remote agent. `checks`
# names files in checks/ (without .sh); omit it to run every check. `user`
# overrides the login for one host; the same key is used everywhere.

user = "astro-gadget"

[[host]]
name = "arnor"
address = "arnor.astro.washington.edu"

[[host]]
name = "gondor"
address = "gondor.astro.washington.edu"

# shire is the NFS server for /data/shire and /nvme/shiren. astro-gadget
# can't log in there; the key is authorized for a local account instead
# (uid 1000, home on local disk). Its checks are listed so shire doesn't run
# the ones that only make sense on a compute host: no NFS client mounts, no
# JupyterHub, no GPUs. rdma covers its bonded mlx5_bond_0.
[[host]]
name = "shire"
address = "shire.astro.washington.edu"
user = "astro-gadgetmon"
checks = ["cpu", "load", "memory", "procs", "rdma", "vmstat", "users"]
