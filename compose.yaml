# gadget-monitor: SSH-based monitoring for arnor and gondor.
#
#   sudo ./init.sh
#   podman compose up -d --build
#
# Five containers, all running as the service account from service.conf:
#   victoriametrics  time-series database (data on local disk)
#   grafana          dashboards, published on 127.0.0.1:8080
#   collector        runs checks on the targets over persistent SSH sessions
#   backup           hourly/daily backups of local state to /service/shire
#   monitoring       this VM's CPU, memory and disks, on port 9110
#                    (monitoring/, the same container every service VM runs)
#
# Every variable below comes from .env, written by init.sh from service.conf
# and the host. There are no defaults; missing values make compose fail.

name: gadget-monitor

services:
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.154.0
    container_name: gadget-monitor-vm
    user: "${SVC_UID}:${SVC_GID}"
    command:
      - -storageDataPath=/storage
      - -httpListenAddr=:8428
      # One year, as UW's records schedule asks of system usage monitoring
      # (see PLAN.md, "Retention").
      - -retentionPeriod=1y
      # Bound the number of distinct series so a misbehaving check cannot grow
      # the database without limit (see PLAN.md, size budget).
      - -storage.maxHourlySeries=20000
      - -storage.maxDailySeries=50000
      - -loggerLevel=WARN
    volumes:
      - "${GADGET_LOCAL_DIR}/vm:/storage:z"
    restart: unless-stopped
    labels:
      idac.service: gadget-monitor

  grafana:
    build:
      context: grafana
    image: localhost/gadget-monitor/grafana:latest
    container_name: gadget-monitor-grafana
    user: "${SVC_UID}:${SVC_GID}"
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_DOMAIN: "${SVC_FQDN}"
      GF_SERVER_ROOT_URL: "https://${SVC_FQDN}/"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/hosts-overview.json
      # UW NetID sign-in through the UW IdP's OpenID Connect (Grafana OSS has
      # no SAML). The entrypoint enables it only when the client id and secret
      # UW-IT issued are on shire (SECRETS.md). Everyone who signs in is a
      # Viewer; grafana/access.py adds them to the team that can see the
      # "UW NetID" folder.
      GF_AUTH_GENERIC_OAUTH_NAME: UW NetID
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://idp.u.washington.edu/idp/profile/oidc/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://idp.u.washington.edu/idp/profile/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://idp.u.washington.edu/idp/profile/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username || sub
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Viewer'"
    volumes:
      - "${GADGET_LOCAL_DIR}/grafana:/var/lib/grafana:z"
      - "${GADGET_SHIRE_DIR}/secrets:/run/secrets/grafana:ro"
    ports:
      - "127.0.0.1:8080:3000"
    restart: unless-stopped
    labels:
      idac.service: gadget-monitor

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
      args:
        SVC_UID: "${SVC_UID}"
        SVC_GID: "${SVC_GID}"
        SVC_USER: "${SVC_USER}"
    image: localhost/gadget-monitor/collector:latest
    container_name: gadget-monitor-collector
    # A real init as PID 1 so SIGTERM stops the container promptly.
    init: true
    user: "${SVC_UID}:${SVC_GID}"
    environment:
      GADGET_VM_URL: http://victoriametrics:8428
    volumes:
      # Read once at startup and copied to /dev/shm (tmpfs) so reconnects never
      # touch the hard-mounted NFS share.
      - "${GADGET_SSH_KEY}:/run/secrets/ssh-key:ro"
      # Only for the free space on the partition holding the database
      # (metrics storage probe); nothing is read from it.
      - "${GADGET_LOCAL_DIR}:/srv/local:ro"
    restart: unless-stopped
    labels:
      idac.service: gadget-monitor

  backup:
    build:
      context: backup
    image: localhost/gadget-monitor/backup:latest
    container_name: gadget-monitor-backup
    # A real init as PID 1 so SIGTERM stops the container promptly.
    init: true
    user: "${SVC_UID}:${SVC_GID}"
    command: ["/usr/local/bin/backup-loop.sh"]
    environment:
      GADGET_VM_URL: http://victoriametrics:8428
    volumes:
      - "${GADGET_LOCAL_DIR}:/data:z"
      - "${GADGET_SHIRE_DIR}/backup:/shire"
    restart: unless-stopped
    labels:
      idac.service: gadget-monitor

  # The service VM monitor, as every service VM runs it: the settings are in
  # monitoring/compose.yaml (see monitoring/README.md). The collector polls it
  # like any other VM in config/service_vms.toml. This VM is SELinux-permissive
  # and logged no denials without its label=disable; it's there for VMs that
  # enforce.
  monitoring:
    extends:
      file: monitoring/compose.yaml
      service: monitoring
    build: monitoring
    container_name: gadget-monitor-service-vm
    labels:
      idac.service: gadget-monitor
